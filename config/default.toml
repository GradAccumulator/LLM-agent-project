[audio]
preferred_device = "BlackShark"
start_timeout_seconds = 4.0
end_silence_seconds = 0.4
max_command_seconds = 15.0
save_audio = true
save_directory = "recordings"
max_saved_files = 5

[wakeword]
threshold = 0.45
cooldown_seconds = 2.0

[vad]
threshold = 0.50

[stt]
model = "turbo"
language = "ko"
device = "auto"
compute_type = "float16"
beam_size = 1
best_of = 1
model_directory = "models/faster-whisper"
workers = 2
warmup = true
cpu_threads = 16

[llm]
model = "gpt-5.6-luna"
reasoning = "low"
max_output_tokens = 512
timeout_seconds = 60.0
memory = true
tools = true
max_tool_rounds = 12
vision_detail = "original"


[web_search]
# OpenAI Responses API의 hosted web search입니다.
# 브라우저 창을 열지 않고 OpenAI 서버에서 검색합니다.
enabled = true
external_web_access = true
max_sources_display = 5

[tts]
enabled = true
voice = "ko-KR-InJoonNeural"
rate_percent = 0
volume = 100
pitch_hz = 0
max_characters = 1200
first_chunk_characters = 80
chunk_characters = 180
parallel_requests = 3
mixer_buffer = 256






[confirmation]
enabled = true
timeout_seconds = 60.0
high_risk_code_digits = 4
max_code_attempts = 3

[gmail]
enabled = true
credentials_file = "config/gmail_credentials.json"
token_file = "data/gmail_token.json"
user_id = "me"
max_results = 20
max_body_characters = 8000
oauth_port = 0
open_browser_for_auth = true

[google_calendar]
enabled = true
credentials_file = "config/google_calendar_credentials.json"
token_file = "data/google_calendar_token.json"
default_calendar_id = "primary"
max_results = 50
oauth_port = 0
open_browser_for_auth = true

[scheduler]
enabled = true
database = "data/jarvis_tasks.db"
poll_interval_seconds = 0.5
max_tasks = 200
max_message_characters = 500
announce_with_tts = true
max_announcements_per_cycle = 3

[long_term_memory]
enabled = true
database = "data/jarvis_memory.db"
context_limit = 20
max_context_characters = 4000
max_entries = 200
max_value_characters = 2048

[planning]
enabled = true
max_steps = 6
max_repair_attempts = 2

[streaming]
enabled = true
minimum_sentence_characters = 24
maximum_chunk_characters = 160

[conversation]
enabled = true
followup_timeout_seconds = 12.0
max_turns = 8

[browser]
enabled = true
headless = false

# system = 일반 사용자 프로필, automation = Playwright
control_mode = "system"

# msedge, chrome, chromium, custom
# 기본값은 PC에 설치된 Microsoft Edge입니다.
browser = "msedge"

# browser = "custom"일 때만 사용합니다.
# Brave/Vivaldi/Opera 등 Chromium 기반 브라우저의 exe 경로를 적습니다.
executable_path = ""

# 브라우저마다 하위 폴더가 자동 생성됩니다.
# browser_profiles/msedge, browser_profiles/chrome 등
profile_directory = "browser_profiles"

navigation_timeout_seconds = 20.0
action_timeout_seconds = 10.0
max_page_text_characters = 12000

[fast_path]
enabled = true

[barge_in]
enabled = true
vad_threshold = 0.78
grace_seconds = 0.65
trigger_speech_seconds = 0.32
end_silence_seconds = 0.48
max_utterance_seconds = 12.0
pre_roll_seconds = 0.24
minimum_rms = 0.008

[runtime]
show_state_transitions = true
recovery_delay_seconds = 0.25

[metrics]
enabled = true
directory = "logs"
include_text = false
flush_each_event = true
