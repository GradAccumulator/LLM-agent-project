# 이 파일을 config/user.toml로 복사한 뒤 필요한 값만 바꾸세요.

[audio]
preferred_device = "BlackShark"
end_silence_seconds = 0.4
max_saved_files = 5

[wakeword]
threshold = 0.45

[stt]
device = "auto"
compute_type = "float16"
beam_size = 1

[llm]
model = "gpt-5.6-luna"
reasoning = "low"

[tts]
enabled = true
voice = "ko-KR-InJoonNeural"
rate_percent = 4
pitch_hz = -6

[metrics]
enabled = true
# transcript와 답변까지 저장하려면 true.
include_text = false


[conversation]
enabled = true
followup_timeout_seconds = 12.0
max_turns = 8


[browser]
control_mode = "system"
# 설치된 Microsoft Edge
browser = "msedge"
executable_path = ""
profile_directory = "browser_profiles"

[fast_path]
enabled = true


[barge_in]
enabled = true
vad_threshold = 0.78
trigger_speech_seconds = 0.32
minimum_rms = 0.008


[streaming]
enabled = true
minimum_sentence_characters = 24
maximum_chunk_characters = 160


[planning]
enabled = true
max_steps = 6
max_repair_attempts = 2


[long_term_memory]
enabled = true
database = "data/jarvis_memory.db"
context_limit = 20
max_context_characters = 4000
max_entries = 200
max_value_characters = 2048
